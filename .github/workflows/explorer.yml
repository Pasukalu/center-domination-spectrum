name: Explorer checks
on:
  push:
    paths: ['docs/**', 'tests/explorer.test.mjs', '.github/workflows/explorer.yml']
  pull_request:
    paths: ['docs/**', 'tests/explorer.test.mjs', '.github/workflows/explorer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/explorer.test.mjs
      - run: node --check docs/app.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: graph-center-explorer
          path: docs/

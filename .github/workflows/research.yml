name: Research checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  formalization:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - run: lake exe cache get Mathlib.Combinatorics.SimpleGraph.Metric Mathlib.Tactic.DeriveFintype Mathlib.Algebra.Order.Field.Rat Mathlib.Algebra.Order.BigOperators.Group.Finset
      - run: python3 scripts/verify_lean.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-diagnostics
          path: verification/*.log
          if-no-files-found: ignore
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 experiments/enumerate_graphs.py --out /tmp/center-results.json
      - run: diff -u experiments/results.json /tmp/center-results.json
      - run: python3 experiments/independent_check.py
      - run: python3 experiments/check_appendages.py
      - run: python3 experiments/audit_seven.py
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended lmodern poppler-utils
      - working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: paper/main.pdf
      - name: Compare the committed PDF with the rebuilt pages and hyperlinks
        run: |
          git show HEAD:paper/main.pdf > "$RUNNER_TEMP/committed.pdf"
          mkdir "$RUNNER_TEMP/committed-pages" "$RUNNER_TEMP/rebuilt-pages"
          pdftoppm -r 120 -gray "$RUNNER_TEMP/committed.pdf" "$RUNNER_TEMP/committed-pages/page"
          pdftoppm -r 120 -gray paper/main.pdf "$RUNNER_TEMP/rebuilt-pages/page"
          diff -qr "$RUNNER_TEMP/committed-pages" "$RUNNER_TEMP/rebuilt-pages"
          pdfinfo -url "$RUNNER_TEMP/committed.pdf" > "$RUNNER_TEMP/committed-urls"
          pdfinfo -url paper/main.pdf > "$RUNNER_TEMP/rebuilt-urls"
          diff -u "$RUNNER_TEMP/committed-urls" "$RUNNER_TEMP/rebuilt-urls"


name: Archive v0.9.0 manuscript
on:
  push:
    branches: [release/v0.9.0-preview]
    paths: ['.github/workflows/archive-preview-pdf.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-v090-preview
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/release/v0.9.0-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.9.0-preview
          fetch-depth: 1
      - name: Install manuscript compiler
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended lmodern poppler-utils
      - name: Rebuild and check manuscript
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = release/v0.9.0-preview
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- paper/main.tex)"
          export FORCE_SOURCE_DATE=1
          cd paper
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          pdftotext main.pdf /tmp/preview-manuscript.txt
          grep -F '84 named declarations' /tmp/preview-manuscript.txt
          pdfinfo main.pdf
          cd ..
          sha256sum paper/main.pdf > paper/main.pdf.sha256
          sha256sum -c paper/main.pdf.sha256
      - name: Commit only the manuscript and checksum to the packaging branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = release/v0.9.0-preview
          git add -f paper/main.pdf paper/main.pdf.sha256
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "Manuscript archive is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive rebuilt v0.9.0 research preview manuscript and SHA-256"
          git push origin HEAD:refs/heads/release/v0.9.0-preview
